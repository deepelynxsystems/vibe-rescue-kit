<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="t-leaked-secrets">
  <title id="t-leaked-secrets">Leaked secrets leave the client bundle before and after</title>
  <rect width="1080" height="300" rx="20" fill="#0f1216"/>
  <text x="28" y="42" fill="#ff6b3d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">leaked-secrets</text>
  <text x="28" y="70" fill="#eef1f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Leaked secrets leave the client bundle</text>
  <rect x="28" y="92" width="500" height="180" rx="14" fill="#191e25" stroke="#5a2c22"/>
  <rect x="552" y="92" width="500" height="180" rx="14" fill="#191e25" stroke="#1d5c45"/>
  <text x="48" y="116" fill="#ff6b3d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">BEFORE</text>
  <text x="572" y="116" fill="#3ddc9a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">AFTER</text>
  <text x="48" y="148" fill="#f3c4b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">const key = "sk_test_…"</text>
<text x="48" y="174" fill="#f3c4b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">import.meta.env.VITE_SERVICE_ROLE</text>
<text x="48" y="200" fill="#f3c4b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">.env            # not gitignored</text>
  <text x="572" y="148" fill="#d7f8ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">serverOnlyEnv("STRIPE_SECRET_KEY")</text>
<text x="572" y="174" fill="#d7f8ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"># value moved into gitignored .env</text>
<text x="572" y="200" fill="#d7f8ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">.env.example     # empty, rotate it</text>
</svg>
