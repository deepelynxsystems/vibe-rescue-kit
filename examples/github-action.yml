# Copy to .github/workflows/vibe-rescue.yml in the repository you want to scan.
# Point the moving v1 tag at the release before pinning @v1.
name: vibe-rescue

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: deepelynxsystems/vibe-rescue-kit@v1
        with:
          path: .
          mode: scan
          fail-on-findings: true
          severity: warning
