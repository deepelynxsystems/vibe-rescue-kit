name: vibe-rescue

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  vibe-rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: deepelynxsystems/vibe-rescue-kit@v1
        with:
          path: .
          mode: MODE_VALUE
          fail-on-findings: true
